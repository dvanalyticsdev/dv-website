# DV Analytics SEO/performance reference config for nginx deployments.
# Apply inside the production server block after confirming the live document root.

gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/xml
  text/javascript
  application/javascript
  application/json
  application/ld+json
  application/xml
  image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

location ~* \.(?:css|js|mjs|png|jpg|jpeg|webp|svg|ico|pdf|mp4|woff2)$ {
  expires 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location = /payment {
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files $uri /index.html;
}

location = /payment/index.php {
  add_header X-Robots-Tag "noindex, nofollow" always;
  try_files $uri /index.html;
}

location / {
  try_files $uri $uri/ /index.html;
}
