name: Automated AI Blog Generator (Controlled by Admin Panel)

on:
  schedule:
    # Check hourly; script checks if Auto Generator is ENABLED and matches scheduled IST hour
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ai-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Admin State & Generate AI Blog
        run: node scripts/create-ai-blog.mjs

      - name: Commit and Push Generated Blog Draft
        run: |
          git config --local user.name "DV AI Auto-Writer"
          git config --local user.email "ai-writer@dvanalyticsmds.com"
          git add src/data/aiBlogQueue.ts public/blogs/
          git diff --staged --quiet || (git commit -m "feat(ai): Auto-generate scheduled AI blog draft" && git push)
