name: Automated AI Blog Generator (Controlled by Admin Panel)

on:
  schedule:
    # Check every 5 minutes; the script honors the Admin Panel IST time and prevents duplicate daily runs.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-ai-blog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Check Admin State & Generate AI Blog
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
        run: npm run generate:blog

      - name: Commit and Push Generated Blog Draft
        run: |
          git config --local user.name "DV AI Auto-Writer"
          git config --local user.email "ai-writer@dvanalyticsmds.com"
          git add src/data/aiBlogQueue.ts public/blogs/
          git diff --staged --quiet || (git commit -m "feat(ai): Auto-generate scheduled AI blog draft" && git push)

      - name: Mark Scheduled Run Complete
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/create-ai-blog.mjs --mark-run-complete
